{% extends "core/base.html" %}
{% block content %}
<div class="auth-container">
  <h1>Reset Password</h1>
  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="auth-btn">Reset Password</button>
    </form>
  {% else %}
    <p>Invalid or expired reset link.</p>
  {% endif %}
</div>
{% endblock %}
